<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Sombra suave -->
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.2"/>
  </filter>

  <!-- Vaso de refresco -->
  <path d="M128 160 L384 160 L352 448 Q352 480 320 480 L192 480 Q160 480 160 448 Z" 
        fill="#2196F3" stroke="#1565C0" stroke-width="15" filter="url(#shadow)"/>
  
  <!-- Parte superior del vaso -->
  <path d="M96 128 L416 128 Q432 128 432 144 L432 160 Q432 176 416 176 L96 176 Q80 176 80 160 L80 144 Q80 128 96 128 Z" 
        fill="#42A5F5" stroke="#1565C0" stroke-width="15"/>
  
  <!-- Fondo para el símbolo de refresco -->
  <circle cx="256" cy="256" r="100" fill="rgba(255,255,255,0.2)"/>

  <!-- Icono de refresco clásico -->
  <g transform="translate(256, 256) scale(0.7)">
    <!-- Círculo base -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#FFFFFF" stroke-width="25"/>
    
    <!-- Flecha superior derecha -->
    <path d="M85 -85 L110 -110 L85 -60" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="25" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Flecha inferior izquierda -->
    <path d="M-85 85 L-110 110 L-85 60" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="25" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Hielo/Burbujas estilizadas -->
  <circle cx="180" cy="240" r="15" fill="white" opacity="0.4"/>
  <circle cx="250" cy="280" r="10" fill="white" opacity="0.4"/>
  <circle cx="320" cy="240" r="20" fill="white" opacity="0.4"/>
</svg>
